<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Soul Spark">
  <desc>Soul Spark: two chart arcs converge into a single heart, with a spark at the meeting point. The arcs are the two people's birth charts; the heart is the synastry between them.</desc>

  <defs>
    <!-- Brand gradient: crimson -> rose -> gold (matches the tool's palette) -->
    <linearGradient id="ssHeart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8E0E2E"/>
      <stop offset="52%"  stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#FF8FA3"/>
    </linearGradient>
    <linearGradient id="ssArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E8B96A"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>
    <radialGradient id="ssGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFD3DC" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#FF4D6D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF4D6D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Two incoming arcs: the separate charts, converging -->
  <path d="M12 84 A 52 52 0 0 1 34 26" fill="none" stroke="url(#ssArc)" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M108 84 A 52 52 0 0 0 86 26" fill="none" stroke="url(#ssArc)" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>

  <!-- The heart formed at the convergence -->
  <path d="M60 96
           C 60 96, 26 74, 26 52
           C 26 40, 35 32, 45 32
           C 52 32, 58 36, 60 42
           C 62 36, 68 32, 75 32
           C 85 32, 94 40, 94 52
           C 94 74, 60 96, 60 96 Z"
        fill="url(#ssHeart)"/>

  <!-- Spark (4-point star) at the exact point of conjunction -->
  <circle cx="60" cy="58" r="17" fill="url(#ssGlow)"/>
  <path d="M60 44 L63.4 54.6 L74 58 L63.4 61.4 L60 72 L56.6 61.4 L46 58 L56.6 54.6 Z"
        fill="#FFF3F6"/>
</svg>
